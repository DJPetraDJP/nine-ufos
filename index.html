<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>NINE UFOS</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#02010c;color:#eef3ff;font-family:Segoe UI,Helvetica,Arial,sans-serif}
canvas{display:block;width:100%;height:100%;cursor:grab}
#overlay.hidden{display:none!important}
.hidden{display:none!important}
header,button,#status,#dock,.hint{font-family:Segoe UI,Helvetica,Arial,sans-serif}
header{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;padding:8px 12px;pointer-events:none}
header *{pointer-events:auto}
.logo{font-weight:800;letter-spacing:.18em;font-size:13px;color:#ffd56a}
button{cursor:pointer;font-size:11px;text-transform:uppercase;color:#ffe9b8;background:#140e28cc;border:1px solid #ffd67866;padding:7px 11px;border-radius:999px}
#status{position:absolute;left:12px;bottom:12px;max-width:280px;background:#08081acc;border:1px solid #ffffff14;border-radius:10px;padding:8px 10px}
#dock{position:absolute;right:10px;top:52px}
.hint{position:absolute;right:12px;bottom:12px;font-size:11px;color:#7f8cb8}
</style>
</head>
<body>
<p>Use the full game file. Redirecting is not used here.</p>
<script>location.replace('./play.html');</script>
</body>
</html>
